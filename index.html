<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZARD</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
      color: #222;
    }
    .game {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px #0001;
    }
    .score {
      font-size: 80px;
      font-weight: bold;
      margin: 30px 0 10px;
    }
    .message {
      font-size: 18px;
      min-height: 2em;
    }
    .clear {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.8;
      white-space: pre-line;
    }
  </style>
</head>
<body>
<div class="game" id="game">
  <h1>ZARD</h1>
  <div class="score" id="score">0</div>
  <p class="message" id="message">
    タグ1とタグ2を交互にタッチしよう！
  </p>
  <p id="lastTag"></p>
</div>

<script>
  const STORAGE_SCORE = "nfc_score";
  const STORAGE_LAST = "nfc_last_tag";
  const CLEAR_SCORE = 127;

  function render() {
    const score = Number(localStorage.getItem(STORAGE_SCORE) || 0);
    const lastTag = localStorage.getItem(STORAGE_LAST);

    if (score >= CLEAR_SCORE) {
      document.getElementById("game").innerHTML = `
        <h1>ZARD</h1>
        <p class="clear">最後まで走り抜けた！
スタッフにこの画面を見せよう</p>
      `;
      return;
    }

    document.getElementById("score").textContent = score;
    document.getElementById("lastTag").textContent =
      lastTag === "1" || lastTag === "2"
        ? "前回のタッチ：タグ " + lastTag
        : "";
  }

  function processTouch(tag) {
    if (tag !== "1" && tag !== "2") return;

    const lastTag = localStorage.getItem(STORAGE_LAST);
    let score = Number(localStorage.getItem(STORAGE_SCORE) || 0);

    if (score >= CLEAR_SCORE) {
      render();
      return;
    }

    if (lastTag === tag) {
      document.getElementById("message").textContent =
        "同じタグです。反対側にタッチしてください！";
      render();
      return;
    }

    score++;
    localStorage.setItem(STORAGE_SCORE, String(score));
    localStorage.setItem(STORAGE_LAST, tag);

    if (score >= CLEAR_SCORE) {
      render();
      return;
    }

    document.getElementById("message").textContent = "成功！ +1 点";
    render();
  }

  function handleNFC() {
    const url = new URL(location.href);
    const rawTag = url.searchParams.get("tag");

    if (rawTag === null) return;

    url.searchParams.delete("tag");
    history.replaceState(null, "", url.pathname + url.search + url.hash);

    const tags = {
      "ApznPPz8k61": "1",
      "KQTAnjDYLP2": "2"
    };

    const tag = tags[rawTag];
    if (tag) processTouch(tag);
  }

  render();
  handleNFC();
</script>
</body>
</html>
