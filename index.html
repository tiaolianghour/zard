
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZARD</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
      color: #222;
    }

    .game {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px #0001;
    }

    .score {
      font-size: 80px;
      font-weight: bold;
      margin: 30px 0 10px;
    }

    .message {
      font-size: 18px;
      min-height: 2em;
    }

    .debug {
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<div class="game">
  <h1>ZARD</h1>

  <div class="score" id="score">0</div>

  <p class="message" id="message">
    タグ1とタグ2を交互にタッチしよう！
  </p>

  <p id="lastTag"></p>
  <p class="debug" id="debug"></p>
</div>

<script>
  const STORAGE_SCORE = "nfc_score";
  const STORAGE_LAST = "nfc_last_tag";

  // タグの固有コードを数字に変換
  function convtag(value) {
    if (value === "ApznPPz8k61") return "1";
    if (value === "KQTAnjDYLP2") return "2";
    return null;
  }

  let score = Number(
    localStorage.getItem(STORAGE_SCORE) || 0
  );

  // 保存データも必ず数字に統一
  let lastTag = localStorage.getItem(STORAGE_LAST);

  if (lastTag !== "1" && lastTag !== "2") {
    lastTag = null;
  }

  function render() {
    document.getElementById("score").textContent = score;

    document.getElementById("lastTag").textContent =
      lastTag === null
        ? "開始前"
        : "前回のタッチ：タグ " + lastTag;

    document.getElementById("debug").textContent =
      "保存値: " + localStorage.getItem(STORAGE_LAST);
  }

  function showMessage(message) {
    document.getElementById("message").textContent = message;
  }

  function processTouch(tag) {
    // 不正な値は受け付けない
    if (tag !== "1" && tag !== "2") return;

    // 初回
    if (lastTag === null) {
      lastTag = tag;
      showMessage("タグ" + tag + "からスタート！");
    }
    // 同じタグ
    else if (lastTag === tag) {
      showMessage(
        "同じタグです！反対側にタッチしてください。"
      );
      render();
      return;
    }
    // 交互タッチ
    else {
      score++;
      lastTag = tag;
      showMessage("成功！ +1 点");
    }

    localStorage.setItem(STORAGE_SCORE, String(score));
    localStorage.setItem(STORAGE_LAST, lastTag);

    render();
  }

  function handleNFC() {
    const url = new URL(location.href);
    const rawTag = url.searchParams.get("tag");

    if (rawTag === null) return;

    // タグ情報を先にURLから削除
    url.searchParams.delete("tag");

    history.replaceState(
      null,
      "",
      url.pathname + url.search + url.hash
    );

    const tag = convtag(rawTag);

    if (tag === null) {
      showMessage("認識できないタグです");
      return;
    }

    processTouch(tag);
  }

  render();
  handleNFC();
</script>

</body>
</html>
