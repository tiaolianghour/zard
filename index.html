
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZARD</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
      color: #222;
    }

    .game {
      max-width: 420px;
      margin: auto;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px #0001;
    }

    .score {
      font-size: 80px;
      font-weight: bold;
      margin: 30px 0 10px;
    }

    .message {
      font-size: 18px;
      min-height: 2em;
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="game">
  <h1>ZARD</h1>

  <div class="score" id="score">0</div>
  <p class="message" id="message">
    タグ 1 とタグ 2 を交互にタッチしよう！
  </p>

  <p id="lastTag"></p>
</div>

<script>
  const STORAGE_SCORE = "nfc_score";
  const STORAGE_LAST = "nfc_last_tag";

  let score = Number(
    localStorage.getItem(STORAGE_SCORE) || 0
  );

  function convtag(value) {
    if (value === "ApznPPz8k61" || value === "1") {
      return "1";
    }
  
    if (value === "KQTAnjDYLP2" || value === "2") {
      return "2";
    }
  
    return null;
  }

  let lastTag = convtag(localStorage.getItem(STORAGE_LAST));

  function render() {
    document.getElementById("score").textContent = score;

    document.getElementById("lastTag").textContent =
      lastTag === null
        ? "開始前"
        : "前回のタッチ：タグ " + lastTag;
  }

  function processTouch(tag) {
    if (lastTag === null) {
      // 初回はスタート地点として登録
      lastTag = tag;
      showMessage("成功！ +1 点");
    } else if (lastTag === tag) {
      // 同じタグの連続タッチは無効
      showMessage("同じタグです。反対側にタッチしてください！");
      return;
    } else {
      // 交互タッチ成功
      score++;
      lastTag = tag;
      showMessage("成功！ +1 点");
    }

    localStorage.setItem(STORAGE_SCORE, score);
    localStorage.setItem(STORAGE_LAST, lastTag);

    render();
  }

  function showMessage(message) {
    document.getElementById("message").textContent = message;
  }

  // NFCタグから渡されたURLパラメータを処理
  function handleNFC() {
    const url = new URL(location.href);
    const tag = url.searchParams.get("tag");

    if (tag === null) return;

    // 最初にURLからtagを削除する
    url.searchParams.delete("tag");

    history.replaceState(
      null,
      "",
      url.pathname + url.search + url.hash
    );

    // 正しいタグ番号だけを処理
    if (tag === "ApznPPz8k61" || tag === "KQTAnjDYLP2") {
      processTouch(convtag(tag));
    }
  }

  render();
  handleNFC();
</script>

</body>
</html>
